[package]
name = "imagesmith-cli"
version.workspace = true
edition.workspace = true
description = "imagesmith command-line front end"

[[bin]]
name = "imagesmith"
path = "src/main.rs"

[dependencies]
imagesmith-core = { path = "../imagesmith-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rpassword = "7"
serde_json = "1"
