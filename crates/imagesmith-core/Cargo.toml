[package]
name = "imagesmith-core"
version.workspace = true
edition.workspace = true
description = "Headless ImageSmith core: recipes, validation, container runner, builds"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tar = "0.4"
libc = "0.2"
dirs = "6"
zstd = "0.13"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
